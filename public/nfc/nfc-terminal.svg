<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#0b101c"/>
    </linearGradient>
    <radialGradient id="ring" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#6ba3ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6ba3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg3)"/>
  <rect width="640" height="800" fill="url(#ring)"/>
  <!-- terminal -->
  <rect x="170" y="210" width="300" height="360" rx="34" fill="#151c2c" stroke="rgba(255,255,255,0.16)" stroke-width="3"/>
  <rect x="196" y="246" width="248" height="180" rx="18" fill="#0d1422"/>
  <text x="320" y="310" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-family="Arial, sans-serif" font-size="22" letter-spacing="2">READY TO TAP</text>
  <!-- large NFC symbol -->
  <g transform="translate(320 400)" stroke="#9bc0ff" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M-28 -10c18-18 38-18 56 0"/>
    <path d="M-52 -34c34-34 70-34 104 0"/>
    <path d="M-76 -58c50-50 102-50 152 0"/>
    <path d="M-100 -82c66-66 134-66 200 0"/>
  </g>
  <circle cx="320" cy="420" r="12" fill="#9bc0ff"/>
  <rect x="250" y="500" width="140" height="18" rx="9" fill="rgba(255,255,255,0.1)"/>
  <text x="320" y="700" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="4">NFC READER</text>
</svg>
