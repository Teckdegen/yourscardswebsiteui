<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#163028"/>
      <stop offset="100%" stop-color="#0a1412"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3d32"/>
      <stop offset="100%" stop-color="#0f221c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg2)"/>
  <!-- debit card -->
  <g transform="translate(90 230) rotate(-12 230 145)">
    <rect width="460" height="290" rx="28" fill="url(#card2)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <rect x="36" y="42" width="54" height="42" rx="8" fill="#c9a227"/>
    <text x="390" y="62" text-anchor="end" fill="rgba(255,255,255,0.45)" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">DEBIT</text>
    <!-- NFC mark on card -->
    <g transform="translate(360 150)" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M0 18c10-10 22-10 32 0"/>
      <path d="M-12 6c18-18 38-18 56 0"/>
      <path d="M-24 -6c26-26 56-26 82 0"/>
      <path d="M-36 -18c34-34 74-34 108 0"/>
    </g>
    <text x="36" y="200" fill="rgba(255,255,255,0.75)" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">"""" 4821</text>
    <text x="36" y="246" fill="rgba(255,255,255,0.85)" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2">YOURS MEMBER</text>
  </g>
  <text x="320" y="700" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="4">CONTACTLESS</text>
</svg>
